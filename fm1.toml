# PROPHET 67 build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "prophet67"                # the build's file names: prophet67-0.1.fwsc, build/host/prophet67_host
title = "PROPHET 67"              # the name people see (firmware hubs)
id_prefix = "FM-1_580"            # package identity: dev FM-1_58000, releases FM-1_580 + XXYYZZ (COLLAPSE 579)
usb_manufacturer = "swtdr34mz"
usb_product = "PROPHET 67 FM-1"   # the USB name (the MIDI port in a DAW)
o2 = ["dsp/engine.c", "dsp/fx.c", "dsp/clock.c", "dsp/params.c", "dsp/presets.c"]   # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
backup = true                     # backup and restore of the presets and the sequence
cpu2 = true                       # five of the seven voices on the second core (the effects and two voices on the first)
cpu2_fallback = true              # if it fails on an FM-1: one core on, no restart
cpu2_stack = 4096                 # the voices on the second core: room to spare
tagline = "A 7-voice analogue-style poly in the manner of the Prophet-6"
repo = "https://github.com/swtdr34mz-afk/PROPHET-67"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A 7-voice polysynth in the manner of the Sequential Prophet-6: two oscillators with continuously variable shape and hard sync, a sub-octave, a high-pass into a self-oscillating 4-pole low-pass, analogue-style envelopes, the classic POLY MOD (filter envelope and oscillator 2 to oscillator 1's pitch, shape and width and both filters), VINTAGE voice character on SELECT, VOICE SPREAD on ALGORITHM, distortion, a BBD chorus, room/hall/plate/spring reverbs and SPACE, an ambient reverb after the Mercury7. A 16-bar polyphonic step sequencer, an arpeggiator, MIDI clock in. Unofficial."
tags = ["synth"]
install = "https://github.com/swtdr34mz-afk/PROPHET-67/releases"
screenshot = "site/img/screen-main.png"
